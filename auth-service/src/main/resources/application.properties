server.port=${AUTH_PORT:8081}
spring.datasource.url=jdbc:h2:file:./data/authentication;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.admin.email=${ADMIN_EMAIL:admin@mcmovilcare.local}
app.admin.password=${ADMIN_PASSWORD:AdminLocal2026!}
app.session.expiration-hours=${ADMIN_SESSION_HOURS:8}